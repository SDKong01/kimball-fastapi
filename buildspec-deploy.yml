version: 0.2

env:
  variables:
    AWS_REGION: "us-east-2"
    APP_PORT: "8080"   # <-- make sure your container actually listens on this port

phases:
  build:
    commands:
      - set -e

      # Required env var must be set in the CodeBuild project's environment (or SSM)
      - test -n "$APP_RUNNER_SERVICE_ARN" || { echo "APP_RUNNER_SERVICE_ARN missing"; exit 1; }
      - test -n "$AWS_REGION" || { echo "AWS_REGION missing"; exit 1; }

      # Read image URI from the Build stage artifact
      - test -f imageDetail.json
      - IMAGE_URI=$(python -c "import json,sys; print(json.load(open('imageDetail.json'))['imageUri'])")

      # Show what we'll use (quoted so you can see empties/whitespace)
      - echo "ServiceARN=$APP_RUNNER_SERVICE_ARN"
      - echo "Region=$AWS_REGION"
      - echo "ImageURI=$IMAGE_URI"
      - echo "Port=$APP_PORT"

      # Build a clean JSON for --source-configuration
      - |
        cat > source-config.json <<JSON
        {
          "ImageRepository": {
            "ImageIdentifier": "${IMAGE_URI}",
            "ImageRepositoryType": "ECR",
            "ImageConfiguration": {
              "Port": "${APP_PORT}",
              "RuntimeEnvironmentVariables": {
                "CORS_ALLOW_ORIGINS": "*",
                "CORS_ALLOW_METHODS": "GET,POST,PUT,DELETE,OPTIONS",
                "CORS_ALLOW_HEADERS": "*",
                "ALLOW_ORIGINS": "*",
                "ALLOW_METHODS": "GET,POST,PUT,DELETE,OPTIONS",
                "ALLOW_HEADERS": "*",
                "ALLOWED_ORIGINS": "*",
                "ALLOWED_METHODS": "GET,POST,PUT,DELETE,OPTIONS",
                "ALLOWED_HEADERS": "*",
                "CORS_ORIGINS": "*",
                "CORS_METHODS": "GET,POST,PUT,DELETE,OPTIONS",
                "CORS_HEADERS": "*",
                "MONGO_HOST": "dev.kj6fy.mongodb.net",
                "MONGO_PORT": "27017",
                "MONGO_USER": "generic-user",
                "MONGO_PASS": "pZJ0t5nQPwkOJ7BK",
                "MONGO_IS_ATLAS_CLUSTER": "True",
                "REDIS_HOST": "redis",
                "REDIS_PORT": "6379",
                "REDIS_PASS": "",
                "REDIS_DB": "0",
                "CLICKHOUSE_HOST": "3.150.3.160",
                "CLICKHOUSE_PORT": "8123",
                "CLICKHOUSE_USER": "default",
                "CLICKHOUSE_PASSWORD": "Kainam2023",
                "CLICKHOUSE_DB": "default"
              }
            }
          }
        }
        JSON

      # Sanity print
      - cat source-config.json

      # Single line — no line continuations
      - aws apprunner update-service --service-arn "$APP_RUNNER_SERVICE_ARN" --source-configuration file://source-config.json --region "$AWS_REGION"

artifacts:
  files:
    - source-config.json
    - imageDetail.json

