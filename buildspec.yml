version: 0.2

env:
  variables:
    IMAGE_REPO_NAME: "kimball-fastapi"
    IMAGE_TAG: "test"
    AWS_REGION: "us-east-2"

phases:
  pre_build:
    commands:
      - echo "Logging in to Amazon ECR..."
      - aws --version
      - REPOSITORY_URI=$(aws ecr describe-repositories --repository-names "$IMAGE_REPO_NAME" --region "$AWS_REGION" --query 'repositories[0].repositoryUri' --output text)
      - REGISTRY="${REPOSITORY_URI%/*}"
      - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"

  build:
    commands:
      - echo "Building Kainam Platform API Docker image..."
      - docker build -t "$REPOSITORY_URI:$IMAGE_TAG" .

  post_build:
    commands:
      - echo "Pushing image to ECR..."
      - docker push "$REPOSITORY_URI:$IMAGE_TAG"
      - echo "Writing imageDetail.json to \$CODEBUILD_SRC_DIR"
      - printf '{"imageUri":"%s"}' "$REPOSITORY_URI:$IMAGE_TAG" > "$CODEBUILD_SRC_DIR/imageDetail.json"
      - echo "PWD is: $(pwd)"
      - ls -lah
      - echo "imageDetail.json contents:"
      - cat "$CODEBUILD_SRC_DIR/imageDetail.json"
      - test -f "$CODEBUILD_SRC_DIR/imageDetail.json" || { echo "imageDetail.json not found"; exit 1; }
      - echo "Kainam Platform API image pushed successfully"

artifacts:
  files:
    - imageDetail.json
