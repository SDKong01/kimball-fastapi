version: 0.2

env:
  variables:
    IMAGE_REPO_NAME: "kimball-fastapi"
    IMAGE_TAG: "test"
    AWS_REGION: "us-east-2"

phases:
  pre_build:
    commands:
      - echo "Logging in to Amazon ECR"
      - aws --version
      - REPOSITORY_URI=$(aws ecr describe-repositories --repository-names "$IMAGE_REPO_NAME" --region "$AWS_REGION" --query 'repositories[0].repositoryUri' --output text)
      - REGISTRY="${REPOSITORY_URI%/*}"
      - PASSWORD=$(aws ecr get-login-password --region "$AWS_REGION")
      - docker login --username AWS --password "$PASSWORD" "$REGISTRY"

  build:
    commands:
      - echo "Building image"
      - docker build -t "$REPOSITORY_URI:$IMAGE_TAG" .

  post_build:
    commands:
      - echo "Pushing image"
      - docker push "$REPOSITORY_URI:$IMAGE_TAG"
      - echo "Writing imageDetail.json"
      - printf '{"imageUri":"%s"}' "$REPOSITORY_URI:$IMAGE_TAG" > "$CODEBUILD_SRC_DIR/imageDetail.json"
      - echo "Verifying artifact location"
      - pwd
      - ls -lah
      - test -f "$CODEBUILD_SRC_DIR/imageDetail.json" || exit 1

artifacts:
  files:
    - imageDetail.json
