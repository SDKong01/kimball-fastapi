version: 0.2

env:
  variables:
    IMAGE_REPO_NAME: "kimball-fastapi"
    IMAGE_TAG: "test"
    AWS_REGION: "us-east-2"

phases:
  pre_build:
    commands:
      - echo "Logging Amazon ECR..."
      - aws --version
      - REPOSITORY_URI=$(aws ecr describe-repositories --repository-names $IMAGE_REPO_NAME --region $AWS_REGION --query "repositories[0].repositoryUri" --output text)
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $REPOSITORY_URI
  build:
    commands:
      - echo "Building Kainam Platform API Docker image..."
      - docker build -t $REPOSITORY_URI:$IMAGE_TAG .
post_build:
  commands:
    - echo "Pushing image to ECR..."
    - docker push $REPOSITORY_URI:$IMAGE_TAG
    - printf '{"imageUri":"%s"}' "$REPOSITORY_URI:$IMAGE_TAG" > imageDetail.json
    - echo "Wrote imageDetail.json with: $(cat imageDetail.json)"
    - ls -lah
    - test -f imageDetail.json || { echo "imageDetail.json not found"; exit 1; }
    - echo "Kainam Platform API image pushed successfully"


artifacts:
  files:
    - imageDetail.json  